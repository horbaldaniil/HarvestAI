[project]
name = "harvestai-backend"
version = "0.1.0"
description = "HarvestAI — Web application for satellite agricultural monitoring and yield prediction"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Daniil Gorbal", email = "daniil.gorbal@lnu.edu.ua" }]
license = { text = "MIT" }

dependencies = [
    # ─── Web framework ───────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # ─── Database ────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    "geoalchemy2>=0.16.0",
    # ─── Config & validation ─────────────────────────
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    # ─── Security ────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=23.1.0",
    "slowapi>=0.1.9",
    # ─── Queue & cache ───────────────────────────────
    "redis>=5.2.0",
    "rq>=2.0.0",
    # ─── Geospatial & ML ─────────────────────────────
    "sentinelhub>=3.10.2",
    "numpy>=2.1.3",
    "pandas>=2.2.3",
    "scikit-learn>=1.5.2",
    "xgboost>=2.1.2",
    "rasterio>=1.4.2",
    "shapely>=2.0.6",
    "joblib>=1.4.2",
    # ─── External APIs ───────────────────────────────
    "openai>=1.54.0",
    "httpx>=0.27.2",
    # ─── PDF generation ──────────────────────────────
    # WeasyPrint is the preferred engine (best CSS support) but it needs GTK3
    # runtime on Windows. xhtml2pdf is pure-Python and works everywhere — we
    # fall back to it automatically when WeasyPrint can't be imported.
    "weasyprint>=63.0",
    "xhtml2pdf>=0.2.16",
    "matplotlib>=3.9.2",
    "jinja2>=3.1.4",
    "qrcode[pil]>=8.0",
    # ─── Utilities ───────────────────────────────────
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "shap>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.2",
    "aiosqlite>=0.20.0",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
    "ipython>=8.29.0",
    "jupyter>=1.1.1",
    "fakeredis>=2.35.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/db/models/*.py" = ["N805"]
"app/tests/*.py" = ["B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

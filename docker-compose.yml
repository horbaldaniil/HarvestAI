services:
  db:
    # Community multi-arch fork of postgis/postgis:16-3.4. Supports both
    # linux/amd64 (Intel Mac, Windows, most Linux) AND linux/arm64
    # (Apple Silicon M1/M2/M3/M4, Raspberry Pi). API-compatible drop-in —
    # PostGIS 3.4 on PostgreSQL 16, same extensions, same migration path
    # for Alembic. Switched from postgis/postgis:16-3.4 because the
    # official image lacks an arm64 manifest, breaking docker compose up
    # on Apple Silicon hosts with a "no matching manifest" error.
    image: imresamu/postgis:16-3.4
    container_name: harvestai-db
    environment:
      POSTGRES_USER: harvestai
      POSTGRES_PASSWORD: harvestai_dev
      POSTGRES_DB: harvestai
    ports:
      - "5432:5432"
    volumes:
      - harvestai_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harvestai -d harvestai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: harvestai-redis
    ports:
      - "6379:6379"
    volumes:
      - harvestai_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  harvestai_db_data:
  harvestai_redis_data:
